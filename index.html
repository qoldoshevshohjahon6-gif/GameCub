 const round=()=>{if(g.over)return;my=-1;let t=5;
  bd.innerHTML=`<div class="big tc" id="rsc">${mine()} : ${theirs()}</div><div class="big tc" id="rtm">${t}</div><div class="row" id="rch">`+N.map((n,i)=>`<button class="btn g" data-p="${i}">${ic(n,44)}</button>`).join('')+'</div><div class="tc big" id="rrv"></div>';
  $('#rch').onclick=e=>{const b=e.target.closest('button');if(b)pick(+b.dataset.p)};
  clearInterval(cd);cd=setInterval(()=>{if(g!==G||g.over){clearInterval(cd);return}t--;$('#rtm').textContent=Math.max(t,0);if(t<=0){clearInterval(cd);if(my<0)pick(Math.random()*3|0)}},1000)};
 const pick=i=>{if(my>=0||g.over)return;my=i;[...$('#rch').children].forEach((b,j)=>b.classList.toggle('sel',j===i));if(host){pk[0]=i;chk()}else send({t:'move',k:'p',v:i})};
 const chk=()=>{if(pk[0]>=0&&pk[1]>=0){const h=pk[0],q=pk[1];send({t:'move',k:'rev',h,g:q});rev(h,q)}};
 const rev=(h,q)=>{clearInterval(cd);pk=[-1,-1];const d=(h-q+3)%3;if(d===1)sc[0]++;else if(d===2)sc[1]++;const a=host?h:q,b=host?q:h,w=(d===1)===host;
  $('#rrv').innerHTML=ic(N[a],44)+' &nbsp;vs&nbsp; '+ic(N[b],44)+'<div class="sm">'+(d===0?'Durang, qaytadan':w?'Siz yutdingiz':'Raqib yutdi')+'</div>';$('#rsc').textContent=mine()+' : '+theirs();SFX[d===0?'draw':w?'win':'lose']();
  if(sc[0]>=3||sc[1]>=3)setTimeout(()=>end(sc[0]>=3?1:0),1400);else setTimeout(()=>{if(g===G&&!g.over)round()},1800)};
 g.rm=m=>{if(m.k==='p'){pk[1]=m.v;chk()}else if(m.k==='rev')rev(m.h,m.g)};round()}
function snakeInit(){const g=G,cv=$('#cv'),x=cv.getContext('2d'),host=S.host,C=20,R=27,Z=16,H0=[[3,13],[16,13]];let tr=[],sc=[0,0],pend=[0,0],spd=130,hp,gp,hd,gd,occ;
 g.st=()=>`Chap/o'ng yarmini bosib buring · Raund: ${host?sc[0]:sc[1]} : ${host?sc[1]:sc[0]}`;
 const col=o=>(o===0)===host?'#22e5ff':'#ff3dbd';
 const draw=()=>{x.fillStyle='#0a0f2c';x.fillRect(0,0,320,440);x.strokeStyle='#2b3a8a';x.strokeRect(0,0,C*Z,R*Z);tr.forEach(t=>{x.fillStyle=col(t[2]);x.fillRect(t[0]*Z+1,t[1]*Z+1,Z-2,Z-2)})};
 const init=()=>{tr=[[H0[0][0],H0[0][1],0],[H0[1][0],H0[1][1],1]];draw()};
 cv.onpointermove=null;cv.onpointerdown=e=>{if(g.over)return;const r=cv.getBoundingClientRect(),t=(e.clientX-r.left)/r.width<.5?-1:1;if(host)pend[0]=t;else send({t:'pp',x:t})};
 if(host){g.pp=t=>{pend[1]=t};
  const start=()=>{if(g!==G||g.over)return;occ=new Set(H0.map(p=>p[1]*C+p[0]));hp=H0[0].slice();gp=H0[1].slice();hd=[1,0];gd=[-1,0];pend=[0,0];spd=130;init();send({t:'pg',k:'rs'});status();setTimeout(tick,1200)};
  const tick=()=>{if(g!==G||g.over||!conn)return;
   const nd=[hd,gd].map((d,i)=>{const p=pend[i];pend[i]=0;return p<0?[d[1],-d[0]]:p>0?[-d[1],d[0]]:d});hd=nd[0];gd=nd[1];
   const nh=[hp[0]+hd[0],hp[1]+hd[1]],ng=[gp[0]+gd[0],gp[1]+gd[1]],same=nh[0]===ng[0]&&nh[1]===ng[1],bad=p=>p[0]<0||p[0]>=C||p[1]<0||p[1]>=R||occ.has(p[1]*C+p[0]);
   const dh=bad(nh)||same,dg=bad(ng)||same;
   if(!dh){hp=nh;occ.add(nh[1]*C+nh[0]);tr.push([nh[0],nh[1],0])}if(!dg){gp=ng;occ.add(ng[1]*C+ng[0]);tr.push([ng[0],ng[1],1])}
   draw();
   if(dh||dg){const w=dh&&dg?-1:dh?1:0;if(w>=0)sc[w]++;send({t:'pg',k:'re',w,s:sc,h:hp,q:gp});SFX[w<0?'draw':w===0?'win':'lose']();status();
    if(sc[0]>=2||sc[1]>=2){const hw=sc[0]>=2?1:0;send({t:'pe',w:hw});setTimeout(()=>end(hw),900)}else setTimeout(start,1500);return}
   send({t:'pg',k:'tk',h:hp,q:gp});spd=Math.max(70,spd-1);setTimeout(tick,spd)};
  start()}
 else{init();g.pg=m=>{if(g.over)return;if(m.k==='rs'){init();status()}else if(m.k==='tk'){tr.push([m.h[0],m.h[1],0],[m.q[0],m.q[1],1]);draw()}
  else if(m.k==='re'){tr.push([m.h[0],m.h[1],0],[m.q[0],m.q[1],1]);draw();sc=m.s;status();SFX[m.w<0?'draw':m.w===1?'win':'lose']()}};g.pe=m=>setTimeout(()=>end(m.w),900)}}
function parolInit(){const g=G,bd=$('#bd'),mg=[],og=[],oth=k=>k==='X'?'O':'X';let sec='',val='',rd=0,or=0;g.ph='set';
 g.st=()=>g.ph==='set'?(rd?'Raqib parol tanlashini kutamiz...':'Yashirin 4 xonali parolingizni kiriting'):g.turn===g.me?'Sizning navbatingiz: raqib parolini toping':'Raqib taxmin qilmoqda...';
 const row=l=>l.slice().reverse().map(r=>`<div class="sm">${r.v} · ${r.h?r.h+" ta son to'g'ri":"moslik yo'q"}</div>`).join('');
 const draw=()=>{bd.className='bd pr';bd.innerHTML=(sec?`<div class="sm tc">Sizning parolingiz: <b>${sec}</b></div>`:'')+(g.ph==='play'?`<div class="row"><div><div class="sm">Sizning urinishlaringiz</div>${row(mg)}</div><div><div class="sm">Raqib urinishlari</div>${row(og)}</div></div>`:'')+`<div class="big tc">${(val+'____').slice(0,4).split('').join(' ')}</div><div class="np">`+[1,2,3,4,5,6,7,8,9,'←',0,'OK'].map(k=>`<button class="btn g" data-k="${k}">${k}</button>`).join('')+'</div>';
  bd.querySelector('.np').onclick=e=>{const b=e.target.closest('button');if(b)key(b.dataset.k)}};
 const chk=()=>{if(rd&&or&&g.ph==='set'){g.ph='play';draw();status()}};
 const key=k=>{if(g.over||(g.ph==='set'?rd:(g.turn!==g.me||g.wait)))return;
  if(k==='←')val=val.slice(0,-1);else if(k==='OK'){if(val.length<4)return toast('4 ta raqam kiriting');
   if(g.ph==='set'){sec=val;val='';rd=1;send({t:'move',k:'rdy'});chk();status()}
   else{if(mg.some(r=>r.v===val))return toast('Bu raqamni aytgansiz');g.wait=1;send({t:'move',k:'gs',v:val});val=''}}
  else if(val.length<4)val+=k;draw()};
 g.rm=m=>{if(m.k==='rdy'){or=1;chk()}
  else if(m.k==='gs'){let h=0;for(let i=0;i<4;i++)if(sec[i]===m.v[i])h++;og.push({v:m.v,h});send({t:'move',k:'gr',v:m.v,h});if(h===4){end(S.host?0:1);return}g.turn=g.me;SFX.o();draw();status()}
  else if(m.k==='gr'){mg.push({v:m.v,h:m.h});g.wait=0;if(m.h===4){end(S.host?1:0);return}g.turn=oth(g.me);SFX.x();draw();status()}};
 draw()}
// ---- dashboard
function dash(res){const hn=S.host?S.me.name:S.op.name,gn=S.host?S.op.name:S.me.name,h=res.reduce((s,r)=>s+r.hp,0),g=res.reduce((s,r)=>s+r.gp,0),rt=v=>v>0?`<span class="gn">${ic('up',16)}</span>`:`<span class="rd">${ic('down',16)}</span>`;
 $('#dw').innerHTML=h===g?ic('equal',30)+' Durang':ic('trophy',30)+' '+esc(h>g?hn:gn)+" g'olib!";
 $('#dt').innerHTML=`<tr><th>O'yin</th><th>${esc(hn)}</th><th>${esc(gn)}</th></tr>`+res.map(r=>`<tr><td>${ic(GAMES[r.g].i,20)}</td><td>${r.hp} ${rt(r.rh)}</td><td>${r.gp} ${rt(r.rg)}</td></tr>`).join('')+`<tr><th>Jami</th><th>${h}</th><th>${g}</th></tr>`;show('dash')}
const toLobby=()=>{S.me.r=0;if(S.op)S.op.r=0;show('lobby');render()};
$('#bl').onclick=()=>{send({t:'lobby'});toLobby()};
</script></body></html>
