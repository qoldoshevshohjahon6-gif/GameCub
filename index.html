function play(m){G={g:m.g,b:Array(9).fill(''),turn:'X',over:0,me:(m.n+(S.host?0:1))%2?'X':'O'};
 const[h,g]=m.sc,me=S.me,op=S.op||{name:'?',av:'a0'};
 $('#gl').innerHTML=avh(me.av)+`<div><div class="nm me">${esc(me.name)}</div><div class="sc">${S.host?h:g}</div></div>`;

 $('#gm').innerHTML=`<div class="gt">${m.tb?ic('zap',13)+' ':''}${GAMES[m.g].n}</div><div id="tn"></div>`;G.nt=!['xo','c4','ship','parol'].includes(m.g);

const status=()=>{$('#gs').textContent=G.over?'':G.st?G.st():G.g==='pong'?"Barmoqni chapga-o'ngga suring · 5 ochkogacha":G.turn===G.me?`Sizning navbatingiz (${G.me==='X'?"ko'k":'pushti'})`:'Raqib navbati...';const t=$('#tn');if(t){const no=G.over||G.nt||G.ph==='set',m=G.turn===G.me;t.innerHTML=no?'':`<span class="ti ${m?'me':'op'}">${m?ic('back',11)+' Sizning navbat':'Raqib navbati '+ic('fwd',11)}</span>`}};
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function place(i,k){G.b[i]=k;const c=$('#bd').children[i];c.textContent=k;c.className='ce '+k;G.turn=k==='X'?'O':'X';SFX[k==='X'?'x':'o']();navigator.vibrate&&navigator.vibrate(15);

 G.rm=m=>place(m.i,G.me==='X'?'O':'X')}
const c4win=(b,k)=>{for(let r=0;r<6;r++)for(let c=0;c<7;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const z=[0,1,2,3].map(i=>[r+dr*i,c+dc*i]);if(z.every(([y,x])=>y>=0&&y<6&&x>=0&&x<7&&b[y*7+x]===k))return z.map(([y,x])=>y*7+x)}return 0};
function c4Init(){G.b=Array(42).fill('');$('#bd').className='bd c4';$('#bd').innerHTML=Array.from({length:42},(_,i)=>`<button class="cc" data-c="${i%7}"></button>`).join('');
 $('#bd').querySelectorAll('.cc').forEach(c=>c.onclick=()=>{const k=+c.dataset.c;if(G.over||G.turn!==G.me)return;if(drop(k,G.me))send({t:'move',c:k})});
 G.rm=m=>drop(m.c,G.me==='X'?'O':'X')}
function drop(c,k){for(let r=5;r>=0;r--){const i=r*7+c;if(!G.b[i]){G.b[i]=k;$('#bd').children[i].className='cc '+k;G.turn=k==='X'?'O':'X';SFX[k==='X'?'x':'o']();navigator.vibrate&&navigator.vibrate(15);
 const w=c4win(G.b,k);if(w){w.forEach(j=>$('#bd').children[j].classList.add('w'));fin(k)}else if(G.b.every(x=>x))fin(null);else status();return 1}}return 0}
function pongInit(){const g=G,cv=$('#cv'),x=cv.getContext('2d'),W=320,H=440,PW=72,PY=34,R=7,host=S.host,cl=v=>Math.max(PW/2,Math.min(W-PW/2,v));
 g.mx=W/2;g.gxv=W/2;g.hxv=W/2;g.sc=[0,0];g.ball={x:W/2,y:H/2,vx:0,vy:0,t:performance.now()};
 let lt=0;cv.onpointerdown=cv.onpointermove=e=>{if(g.over)return;const r=cv.getBoundingClientRect();g.mx=cl((e.clientX-r.left)/r.width*W);if(!host){const n=performance.now();if(n-lt>30){lt=n;send({t:'pp',x:W-g.mx})}}};
 const draw=(bx,by,hx,gx,s)=>{x.clearRect(0,0,W,H);x.save();if(!host){x.translate(W,H);x.rotate(Math.PI)}
  x.strokeStyle='#2b3a8a';x.setLineDash([8,8]);x.beginPath();x.moveTo(0,H/2);x.lineTo(W,H/2);x.stroke();x.setLineDash([]);
  const pad=(px,y,c)=>{x.fillStyle=c;x.shadowColor=c;x.shadowBlur=12;x.beginPath();(x.roundRect||x.rect).call(x,px-PW/2,y-5,PW,10,5);x.fill()};
  pad(hx,H-PY,host?'#22e5ff':'#ff3dbd');pad(gx,PY,host?'#ff3dbd':'#22e5ff');
  x.fillStyle='#fff';x.shadowColor='#fff';x.beginPath();x.arc(bx,by,R,0,7);x.fill();x.restore();
  x.fillStyle='#8f9bd1';x.font='bold 28px system-ui';x.fillText(host?s[1]:s[0],12,H/2-14);x.fillText(host?s[0]:s[1],12,H/2+36)};
 if(host){let bs={x:W/2,y:H/2,vx:0,vy:0},sp=280,pause=performance.now()+1500,last=performance.now(),acc=0;const s=[0,0];
  g.pp=px=>{g.gxv=cl(px)};
  let sv=null;const serve=d=>{bs={x:W/2,y:H/2,vx:0,vy:0};sv={vx:Math.random()*160-80,vy:d*280};sp=280;pause=performance.now()+1200};
  const hit=(px,d)=>{sp=Math.min(sp*1.05,620);const o=(bs.x-px)/(PW/2+R);bs.vx=o*sp*.75;bs.vy=-d*Math.sqrt(Math.max(sp*sp-bs.vx*bs.vx,(sp*.5)**2));SFX.tap()};
  const pt=i=>{s[i]++;SFX.x();if(s[i]>=5){const hp=i===0?1:0;send({t:'pg',b:[W/2,H/2,0,0],p:[g.mx,g.gxv],s});send({t:'pe',w:hp});end(hp);return 1}serve(i===0?-1:1)};
  serve(1);pause=performance.now()+1500;
  const loop=n=>{if(g!==G||g.over||!conn)return;const dt=Math.min((n-last)/1000,.05);last=n;

 g.st=()=>g.ph==='set'?(rd?'Raqib parol tanlashini kutamiz...':'Yashirin 4 xonali parolingizni kiriting'):g.turn===g.me?'Sizning navbatingiz: raqib parolini toping':'Raqib taxmin qilmoqda...';
 const row=l=>l.slice().reverse().map(r=>`<div class="sm">${r.v} · ${r.h?r.h+" ta son to'g'ri":"moslik yo'q"}</div>`).join('');
 const draw=()=>{bd.className='bd pr';bd.innerHTML=(sec?`<div class="sm tc">Sizning parolingiz: <b>${sec}</b></div>`:'')+(g.ph==='play'?`<div class="row"><div><div class="sm">Sizning urinishlaringiz</div>${row(mg)}</div><div><div class="sm">Raqib urinishlari</div>${row(og)}</div></div>`:'')+`<div class="big tc">${(val+'____').slice(0,4).split('').join(' ')}</div><div class="np">`+[1,2,3,4,5,6,7,8,9,'←',0,'OK'].map(k=>`<button class="btn g" data-k="${k}">${k}</button>`).join('')+'</div>';
  bd.querySelector('.np').onclick=e=>{const b=e.target.closest('button');if(b)key(b.dataset.k)}};
 const chk=()=>{if(rd&&or&&g.ph==='set'){g.ph='play';draw();status()}};
 const key=k=>{if(g.over||(g.ph==='set'?rd:(g.turn!==g.me||g.wait)))return;
  if(k==='←')val=val.slice(0,-1);else if(k==='OK'){if(val.length<4)return toast('4 ta raqam kiriting');
   if(g.ph==='set'){sec=val;val='';rd=1;send({t:'move',k:'rdy'});chk();status()}
   else{if(mg.some(r=>r.v===val))return toast('Bu raqamni aytgansiz');g.wait=1;send({t:'move',k:'gs',v:val});val=''}}
  else if(val.length<4)val+=k;draw()};
 g.rm=m=>{if(m.k==='rdy'){or=1;chk()}
  else if(m.k==='gs'){let h=0;for(let i=0;i<4;i++)if(sec[i]===m.v[i])h++;og.push({v:m.v,h});send({t:'move',k:'gr',v:m.v,h});if(h===4){end(S.host?0:1);return}g.turn=g.me;SFX.o();draw();status()}
  else if(m.k==='gr'){mg.push({v:m.v,h:m.h});g.wait=0;if(m.h===4){end(S.host?1:0);return}g.turn=oth(g.me);SFX.x();draw();status()}};
 draw()}
// ---- dashboard
function dash(res){const hn=S.host?S.me.name:S.op.name,gn=S.host?S.op.name:S.me.name,h=res.reduce((s,r)=>s+r.hp,0),g=res.reduce((s,r)=>s+r.gp,0),rt=v=>v>0?`<span class="gn">${ic('up',16)}</span>`:`<span class="rd">${ic('down',16)}</span>`;
 $('#dw').innerHTML=h===g?ic('equal',30)+' Durang':ic('trophy',30)+' '+esc(h>g?hn:gn)+" g'olib!";
 $('#dt').innerHTML=`<tr><th>O'yin</th><th>${esc(hn)}</th><th>${esc(gn)}</th></tr>`+res.map(r=>`<tr><td>${ic(GAMES[r.g].i,20)}</td><td>${r.hp} ${rt(r.rh)}</td><td>${r.gp} ${rt(r.rg)}</td></tr>`).join('')+`<tr><th>Jami</th><th>${h}</th><th>${g}</th></tr>`;show('dash')}
const toLobby=()=>{S.me.r=0;if(S.op)S.op.r=0;show('lobby');render()};
$('#bl').onclick=()=>{send({t:'lobby'});toLobby()};
</script></body></html>
