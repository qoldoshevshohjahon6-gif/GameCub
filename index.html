.pk-t i{width:14px;height:14px;border-radius:50%;border:2px solid #5b6aa8;background:#0a0f2c}.pk-t i.g{background:#2dffa0;border-color:#2dffa0}.pk-t i.m{background:#ff5c5c;border-color:#ff5c5c}.pk-t i.cur{border-color:#ffe29a;animation:bl 1s infinite}@keyframes bl{50%{opacity:.35}}
.pk-msg{text-align:center;min-height:26px;font-size:15px;font-weight:700;margin:4px 0}.pk-msg svg{vertical-align:-3px}
.pk-stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid #2b3a8a;line-height:0}.pk-stage canvas{width:100%;display:block}
.pk-zones{position:absolute;left:13.9%;top:23.1%;width:72.2%;height:25%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.pk-zones button{background:transparent;border:1px dashed #ffffff88;margin:0;padding:0;border-radius:0;color:#fff;transition:.15s}.pk-zones button.sel{background:#22e5ff44;border:2px solid #22e5ff}.pk-zones.off{pointer-events:none}
#sbt{display:flex;gap:12px;padding:10px 16px 0;touch-action:none}.sb{flex:1;height:92px;border-radius:26px;border:3px solid #9fe3ff;background:linear-gradient(#3fa9ff,#1565c0);color:#fff;touch-action:none;display:flex;align-items:center;justify-content:center;margin:0;box-shadow:0 0 16px #1e90ff66}.sb.on{transform:scale(.96);filter:brightness(1.25)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  if(ph==='pre'){pre=Math.max(0,3.6-el);cnt=Math.ceil(pre/1.2);if(cnt!==pc){pc=cnt;if(cnt>0)SFX.ping()}if(pre<=0){ph='play';bl=newBall();SFX.whistle()}}
  else{if(ph==='play'||ph==='sd')tg+=dt;if(ph==='play'){tl=Math.max(0,60-tg);if(tl<=0){ph='fin';SFX.buzz();myFin=score;send({t:'move',k:'fin',v:score});if(bl&&bl.st==='held')bl=null;chkFin()}}}
  if(ph==='play'&&(!bl||bl.st==='held'))tD=SPOT[spotLvl(tg)];if(ph==='sd'&&(!bl||bl.st==='held'))tD=SPOT[0];
  if(tD!==lastTD){if(ph==='play'&&lastTD!==0)say(tD>5?'3 OCHKO ZONASI!':'2 OCHKO ZONASI','#ffd23a');lastTD=tD}
  if(Math.abs(camD-tD)>.002)camD+=(tD-camD)*Math.min(1,dt*2.6);else camD=tD;
  if(!bl&&(ph==='play'||ph==='sd')&&performance.now()>=nextBall&&!(sdOn&&sdM.length>sdI))bl=newBall();
  if(bl){if(bl.st==='held'){bl.z=-camD;bl.D=camD;bl.y=1.25+Math.sin(n/300)*.03;bl.rot+=dt*.4}else{const ns=Math.ceil(dt/.008);for(let i=0;i<ns;i++)step(bl,dt/ns);if(bl.tf>4.5||bl.z>9||Math.abs(bl.x)>9||(bl.y<.2&&Math.abs(bl.vy)<1&&bl.tf>.6)||(bl.made&&bl.y<.3))resolve(bl)}}
  fx.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;p.l-=dt});fx=fx.filter(p=>p.l>0);cf.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt});cf=cf.filter(p=>p.y<H+10);pops.forEach(p=>p.t+=dt);pops=pops.filter(p=>p.t<1.2);if(toast){toast.t+=dt;if(toast.t>1.6)toast=null}
  msgT=Math.max(0,msgT-dt);shake=Math.max(0,shake-dt*2.5);celeb=Math.max(0,celeb-dt);netT+=dt;draw(n,dt);requestAnimationFrame(loop)};
 const spotLvl=t=>[0,1,0,1,1,0,1,0][Math.floor(t/9)%8];
 requestAnimationFrame(loop)}
function parolInit(){const g=G,bd=$('#bd'),mg=[],og=[],oth=k=>k==='X'?'O':'X';let sec='',val='',rd=0,or=0;g.ph='set';
 g.st=()=>g.ph==='set'?(rd?'Raqib parol tanlashini kutamiz...':'Yashirin 4 xonali parolingizni kiriting'):g.turn===g.me?'Sizning navbatingiz: raqib parolini toping':'Raqib taxmin qilmoqda...';
 const row=l=>l.slice().reverse().map(r=>`<div class="sm">${r.v} · ${r.h?r.h+" ta son to'g'ri":"moslik yo'q"}</div>`).join('');
 const draw=()=>{bd.className='bd pr';bd.innerHTML=(sec?`<div class="sm tc">Sizning parolingiz: <b>${sec}</b></div>`:'')+(g.ph==='play'?`<div class="row"><div><div class="sm">Sizning urinishlaringiz</div>${row(mg)}</div><div><div class="sm">Raqib urinishlari</div>${row(og)}</div></div>`:'')+`<div class="big tc">${(val+'____').slice(0,4).split('').join(' ')}</div><div class="np">`+[1,2,3,4,5,6,7,8,9,'←',0,'OK'].map(k=>`<button class="btn g" data-k="${k}">${k}</button>`).join('')+'</div>';
  bd.querySelector('.np').onclick=e=>{const b=e.target.closest('button');if(b)key(b.dataset.k)}};
 const chk=()=>{if(rd&&or&&g.ph==='set'){g.ph='play';draw();status()}};
 const key=k=>{if(g.over||(g.ph==='set'?rd:(g.turn!==g.me||g.wait)))return;
  if(k==='←')val=val.slice(0,-1);else if(k==='OK'){if(val.length<4)return toast('4 ta raqam kiriting');
   if(g.ph==='set'){sec=val;val='';rd=1;send({t:'move',k:'rdy'});chk();status()}
   else{if(mg.some(r=>r.v===val))return toast('Bu raqamni aytgansiz');g.wait=1;send({t:'move',k:'gs',v:val});val=''}}
  else if(val.length<4)val+=k;draw()};
 g.rm=m=>{if(m.k==='rdy'){or=1;chk()}
  else if(m.k==='gs'){let h=0;for(let i=0;i<4;i++)if(sec[i]===m.v[i])h++;og.push({v:m.v,h});send({t:'move',k:'gr',v:m.v,h});if(h===4){end(S.host?0:1);return}g.turn=g.me;SFX.o();draw();status()}
  else if(m.k==='gr'){mg.push({v:m.v,h:m.h});g.wait=0;if(m.h===4){end(S.host?1:0);return}g.turn=oth(g.me);SFX.x();draw();status()}};
 draw()}
// ---- dashboard
function dash(res){const hn=S.host?S.me.name:S.op.name,gn=S.host?S.op.name:S.me.name,h=res.reduce((s,r)=>s+r.hp,0),g=res.reduce((s,r)=>s+r.gp,0),rt=v=>v>0?`<span class="gn">${ic('up',16)}</span>`:`<span class="rd">${ic('down',16)}</span>`;
 $('#dw').innerHTML=h===g?ic('equal',30)+' Durang':ic('trophy',30)+' '+esc(h>g?hn:gn)+" g'olib!";
 $('#dt').innerHTML=`<tr><th>O'yin</th><th>${esc(hn)}</th><th>${esc(gn)}</th></tr>`+res.map(r=>`<tr><td>${ic(GAMES[r.g].i,20)}</td><td>${r.hp} ${rt(r.rh)}</td><td>${r.gp} ${rt(r.rg)}</td></tr>`).join('')+`<tr><th>Jami</th><th>${h}</th><th>${g}</th></tr>`;$('#brm').style.display=S.mode==='free'?'':'none';rmUpd();show('dash')}
const toLobby=()=>{S.meRq=S.opRq=0;S.me.r=0;if(S.op)S.op.r=0;show('lobby');render()};
const rmUpd=()=>{const b=$('#brm');b.disabled=!!S.meRq;b.textContent=S.meRq?(S.opRq?'Boshlanmoqda...':'Raqib kutilmoqda...'):(S.opRq?"Raqib tayyor! Qayta o'ynash":"Qayta o'ynash")};
const startRematch=()=>{S.meRq=S.opRq=0;M={plan:[S.game],res:[],tb:0,rh:null,rg:null};nextGame()};
$('#brm').onclick=()=>{if(S.meRq)return;S.meRq=1;send({t:'rematch'});rmUpd();if(S.host&&S.opRq)startRematch()};
$('#bl').onclick=()=>{send({t:'lobby'});toLobby()};
</script></body></html>
